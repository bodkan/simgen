project:
  type: book

book:
  title: "Computational Population Genomics and Inference in R"
  subtitle: "Learning the fundamentals of population genomics through computer simulations"
  author: "Martin Petr"
  date: "last-modified"
  chapters:
    - index.qmd
    - part: r-intro.qmd
      chapters:
      - r-bootcamp.qmd
    - part: "Welcome to _tidyverse_"
      chapters:
      - tidy-basics.qmd
      - tidy-advanced.qmd
      - tidy-viz.qmd
    - part: "Simulations with _slendr_"
      chapters:
      - models.qmd
      - scheduling.qmd
      - basic-statistics.qmd
      - more-statistics.qmd
      - tree-thinking.qmd
      - haplotype-statistics.qmd
    - part: "Case studies"
      chapters:
      - study-afs.qmd
      - study-neanderthal.qmd
      - study-demografr.qmd
      - study-segregating.qmd
    - resources.qmd
    - references.qmd
    - acknowledgements.qmd
    - part: "Unfinished chapters"
      chapters:
      - structure-admixture.qmd
      - spatial-sf.qmd
      - popgen-nonspatial-pca.qmd
      - popgen-spatial-pca.qmd
      - popgen-tracts-dating.qmd
      - popgen-selection.qmd
      - r-thinking.qmd
      - repro-cli.qmd
    - part: "Archive"
      chapters:
      - popgen-models.qmd
      - popgen-stats.qmd
  appendices:
    - setup-tidyverse.qmd
    - setup-slendr.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    number-sections: false
